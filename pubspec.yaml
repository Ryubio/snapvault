name: snapvault
description: "SnapVault - Zero-background, bilingual (TR/EN) on-demand screenshot organizer & metadata vault."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.6.0
  google_mlkit_text_recognition: ^0.14.0
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  http: ^1.2.2
  image: ^4.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
