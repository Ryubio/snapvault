name: Build SnapVault Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Zero-Lag Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Auto-Scaffold Android SDK 36 & Custom SnapVault Icon
        shell: bash
        run: |
          mkdir -p /tmp/snapvault_backup
          cp pubspec.yaml /tmp/snapvault_backup/pubspec.yaml

          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart /tmp/snapvault_backup/main.dart
          elif [ -f "main.dart" ]; then
            cp main.dart /tmp/snapvault_backup/main.dart
          fi

          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/snapvault_backup/AndroidManifest.xml
          elif [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml /tmp/snapvault_backup/AndroidManifest.xml
          fi

          rm -f main.dart AndroidManifest.xml

          flutter create --org com.snapvault.app --project-name snapvault --platforms=android .

          cp /tmp/snapvault_backup/pubspec.yaml pubspec.yaml
          cp /tmp/snapvault_backup/main.dart lib/main.dart
          cp /tmp/snapvault_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          python3 - << 'PYEOF'
          import os, re, glob, zlib, struct, math

          # 1. Patch AndroidManifest.xml (remove unused provider block & add READ_MEDIA_VIDEO)
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              m = open(manifest_path, "r").read()
              m = re.sub(r"<!-- Force-remove.*?</provider>", "", m, flags=re.S)
              if "READ_MEDIA_VIDEO" not in m:
                  m = m.replace(
                      '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
                      '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />'
                  )
              open(manifest_path, "w").write(m)

          # 2. Patch build.gradle.kts for SDK 36 and ML Kit R8 compatibility
          kts_path = "android/app/build.gradle.kts"
