name: Build SnapVault Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Zero-Lag Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Auto-Scaffold & Configure Android SDK 36
        shell: bash
        run: |
          mkdir -p /tmp/sv_bak
          cp pubspec.yaml /tmp/sv_bak/pubspec.yaml
          cp lib/main.dart /tmp/sv_bak/main.dart
          cp android/app/src/main/AndroidManifest.xml /tmp/sv_bak/AM.xml

          flutter create --org com.snapvault.app --project-name snapvault --platforms=android .

          cp /tmp/sv_bak/pubspec.yaml pubspec.yaml
          cp /tmp/sv_bak/main.dart lib/main.dart
          cp /tmp/sv_bak/AM.xml android/app/src/main/AndroidManifest.xml

          perl -0777 -pi -e 's/\s*<!-- Force-remove.*?<\/provider>//s' android/app/src/main/AndroidManifest.xml

          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle
            sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.debug; minifyEnabled false; shrinkResources false/g' android/app/build.gradle
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("debug"); isMinifyEnabled = false; isShrinkResources = false/g' android/app/build.gradle.kts
          fi

      - name: 5. Install Flutter Dependencies
        run: flutter pub get

      - name: 6. Build Split-per-ABI Release APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: 7. Upload Ready-to-Install ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapVault-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
